syntax = "proto3";
package hello;

service Hello {
    // send an id and get the same id back
    rpc printHello(HelloWorldRequest) returns (HelloWorldResponse) {}

    // greet one person
    rpc SayHello(GreetRequest) returns (GreetReply) {}

    // server streaming, sends `count` greetings back
    rpc SayHelloStream(GreetRequest) returns (stream GreetReply) {}

    // client streaming, send many names and get one greeting for all
    rpc SayHelloToMany(stream GreetRequest) returns (GreetReply) {}
}

message HelloWorldResponse {
    string id = 1;
}

message HelloWorldRequest {
    string id = 1;
}

message GreetRequest {
    string name = 1;
    int32 count = 2;
}

message GreetReply {
    string message = 1;
}
